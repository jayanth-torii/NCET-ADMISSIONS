name: NGI weekly admissions digest

# Fires every Saturday at 09:00 IST (03:30 UTC) and emails the week's new
# applications to the regional counsellor.
on:
  schedule:
    - cron: "30 3 * * 6"
  workflow_dispatch:

jobs:
  digest:
    # Self-hosted runner: the job needs a Node environment and outbound access.
    # Swap to `ubuntu-latest` if you are happy to keep credentials in GitHub Secrets.
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Send weekly digest
        working-directory: api
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: npm run digest
