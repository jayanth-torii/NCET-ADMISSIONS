<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="bTitle bDesc">
  <title id="bTitle">NGI Admissions 2026-27 — Nagarjuna Group of Institutions</title>
  <desc id="bDesc">Navy banner with a drifting aurora glow, rising particles and a shimmer sweep across the title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1f44"/>
      <stop offset=".55" stop-color="#132547"/>
      <stop offset="1" stop-color="#06132b"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0v56" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <radialGradient id="emberGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f6872a" stop-opacity=".5"/>
      <stop offset="1" stop-color="#f6872a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="navyGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3c5b94" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3c5b94" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="emberLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6872a"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="emberText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset=".5" stop-color="#f6872a"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <mask id="titleMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="230">
      <text x="500" y="112" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="60" font-weight="800" letter-spacing="4" fill="#ffffff">NGI ADMISSIONS</text>
    </mask>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <style>
    .drift-a{animation:drift 16s ease-in-out infinite alternate}
    .drift-b{animation:drift 22s ease-in-out infinite alternate-reverse}
    .drift-c{animation:drift 19s ease-in-out infinite alternate}
    @keyframes drift{
      from{transform:translate(-40px,-12px)}
      to{transform:translate(44px,16px)}
    }
    .rise{opacity:0;animation:rise 7s linear infinite}
    .rise.d2{animation-delay:1.1s}
    .rise.d3{animation-delay:2.3s}
    .rise.d4{animation-delay:3.4s}
    .rise.d5{animation-delay:4.6s}
    .rise.d6{animation-delay:5.8s}
    @keyframes rise{
      0%{transform:translateY(0);opacity:0}
      12%{opacity:.65}
      85%{opacity:.25}
      100%{transform:translateY(-150px);opacity:0}
    }
    .shine{animation:shine 4.2s ease-in-out infinite;animation-delay:1.2s}
    @keyframes shine{
      0%{transform:translateX(-260px) skewX(-18deg)}
      55%,100%{transform:translateX(900px) skewX(-18deg)}
    }
    .pulse{animation:pulse 2.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    @media (prefers-reduced-motion: reduce){
      .drift-a,.drift-b,.drift-c,.rise,.shine,.pulse{animation:none}
    }
  </style>

  <rect width="1000" height="230" fill="url(#bg)"/>
  <rect width="1000" height="230" fill="url(#grid)"/>

  <g filter="url(#soft)">
    <ellipse class="drift-a" cx="210" cy="60" rx="190" ry="120" fill="url(#navyGlow)"/>
    <ellipse class="drift-b" cx="810" cy="180" rx="210" ry="130" fill="url(#navyGlow)"/>
    <ellipse class="drift-c" cx="880" cy="40" rx="150" ry="100" fill="url(#emberGlow)"/>
    <ellipse class="drift-b" cx="120" cy="200" rx="130" ry="90" fill="url(#emberGlow)" opacity=".7"/>
  </g>

  <g fill="#fb923c">
    <circle class="rise" cx="140" cy="215" r="2.5"/>
    <circle class="rise d2" cx="300" cy="220" r="2"/>
    <circle class="rise d3" cx="470" cy="218" r="1.6"/>
    <circle class="rise d4" cx="640" cy="222" r="2.2"/>
    <circle class="rise d5" cx="800" cy="216" r="1.8"/>
    <circle class="rise d6" cx="905" cy="220" r="2.4"/>
  </g>

  <text x="500" y="52" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="7" fill="url(#emberText)">NAGARJUNA GROUP OF INSTITUTIONS</text>

  <text x="500" y="112" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="60" font-weight="800" letter-spacing="4" fill="#ffffff">NGI ADMISSIONS</text>

  <g mask="url(#titleMask)">
    <rect class="shine" x="0" y="40" width="160" height="100" fill="#ffffff" opacity=".28"/>
  </g>

  <text x="500" y="142" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#c3d1e7">Admissions 2026-27 · NAAC A+ Accredited · Autonomous under VTU</text>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1">
    <rect x="289" y="166" width="130" height="28" rx="14" fill="#f6872a"/>
    <text x="354" y="184" text-anchor="middle" fill="#0a1f44">2026-27 INTAKE</text>
    <rect class="pulse" x="431" y="166" width="96" height="28" rx="14" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".25"/>
    <text class="pulse" x="479" y="184" text-anchor="middle" fill="#e2e9f4">NAAC A+</text>
    <rect class="pulse" x="539" y="166" width="172" height="28" rx="14" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".25"/>
    <text class="pulse" x="625" y="184" text-anchor="middle" fill="#e2e9f4">AUTONOMOUS · VTU</text>
  </g>

  <rect x="0" y="226" width="1000" height="4" fill="url(#emberLine)"/>
</svg>
