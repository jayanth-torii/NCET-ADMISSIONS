<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="96" viewBox="0 0 1000 96" role="img" aria-labelledby="fTitleD fDescD">
  <title id="fTitleD">Nagarjuna Group of Institutions</title>
  <desc id="fDescD">The institution name flanked by hairlines with a travelling ember glint, over the admissions tagline. Dark-theme variant.</desc>
  <defs>
    <mask id="linesMaskD" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="96">
      <rect x="70" y="35" width="220" height="2" fill="#ffffff"/>
      <rect x="710" y="35" width="220" height="2" fill="#ffffff"/>
    </mask>
  </defs>
  <style>
    .glint{animation:glide 3.2s ease-in-out infinite alternate}
    .glint.g2{animation-delay:-1.6s}
    @keyframes glide{from{transform:translateX(0)}to{transform:translateX(150px)}}
    @media (prefers-reduced-motion: reduce){.glint{animation:none}}
  </style>

  <g mask="url(#linesMaskD)">
    <rect x="70" y="35" width="220" height="2" fill="#2b4478"/>
    <rect x="710" y="35" width="220" height="2" fill="#2b4478"/>
    <rect class="glint" x="70" y="35" width="70" height="2" fill="#f6872a" opacity=".9"/>
    <rect class="glint g2" x="710" y="35" width="70" height="2" fill="#f6872a" opacity=".9"/>
  </g>

  <text x="500" y="42" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#e2e9f4">Nagarjuna Group of Institutions</text>

  <text x="500" y="72" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600" letter-spacing="1.5" fill="#94abcf">ADMISSIONS 2026-27 · NAAC A+ · AUTONOMOUS UNDER VTU</text>
</svg>
